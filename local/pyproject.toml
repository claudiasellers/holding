[project]
name = "holding-local"
version = "0.1.0"
description = "Local, free AI backend for the Holding comforting-parent app: Ollama chat, Kokoro voice, Whisper listening, served on one origin."
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "kokoro-onnx>=0.6.1,<0.7",
  "tokenizers>=0.20",         # Chatterbox's text tokenizer (the voice model itself is optional, downloaded from Settings)
  "python-multipart>=0.0.9",
  "qrcode>=7.4",
  "psutil>=5.9",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.2"]

[project.scripts]
holding-local = "holding_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holding_local"]
