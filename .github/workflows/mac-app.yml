# Builds "Holding Local" for Mac (mac-app/), runs its end-to-end self-test on a real Mac
# (real uv, Python, Ollama and engine, with small models), and makes the .dmg.
# With the Apple secrets below it is signed with a Developer ID and notarized, so it
# opens with a double-click when downloaded. On main it goes to the "latest" release:
# https://github.com/<owner>/<repo>/releases/latest/download/Holding-Local-mac.dmg
#
# Secrets (all optional; without them the build is ad-hoc signed):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application certificate (.p12, base64)
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER   App Store Connect API key for notarytool
name: Mac app

on:
  push:
    branches: [main]
    paths: ['mac-app/**', 'local/**', 'src/**', 'index.html', 'public/**', '.github/workflows/mac-app.yml']
  pull_request:
    paths: ['mac-app/**', 'local/**', 'src/**', 'index.html', '.github/workflows/mac-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build

      - name: Import the Developer ID certificate (if configured)
        id: sign
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No MACOS_CERT_P12_BASE64 secret: building an ad-hoc signed app. Downloaded copies need System Settings > Privacy & Security > Open Anyway."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id="$(security find-identity -v -p codesigning "$kc" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$id" ] || { echo "No Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "identity=$id" >> "$GITHUB_OUTPUT"
          if [ -n "$KEY_P8" ]; then
            echo "$KEY_P8" | base64 -d > "$RUNNER_TEMP/notary.p8"
            echo "key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Holding Local.app (Apple silicon + Intel)
        working-directory: mac-app
        env:
          VERSION: 0.1.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: ./build.sh --universal

      - name: Check the bundle
        working-directory: mac-app
        run: |
          APP="build/Holding Local.app"
          lipo -archs "$APP/Contents/MacOS/HoldingLocal"
          lipo -archs "$APP/Contents/Resources/bin/uv"
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/engine/uv.lock"
          test -f "$APP/Contents/Resources/app/index.html"
          "$APP/Contents/Resources/bin/uv" --version

      - name: Self-test (real install, engine, Ollama and chat model manager, small models)
        working-directory: mac-app
        env:
          HOLDING_APP_HOME: ${{ runner.temp }}/app-home
          HOLDING_LOCAL_HOME: ${{ runner.temp }}/holding-local-home
          HOLDING_OWN_OLLAMA: '1'
          HOLDING_LOG_STDOUT: '1'
        run: |
          mkdir -p "$HOLDING_APP_HOME" "$HOLDING_LOCAL_HOME"
          "build/Holding Local.app/Contents/MacOS/HoldingLocal" --selftest

      - name: Make the .dmg (and notarize it when configured)
        working-directory: mac-app
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARY_KEY_PATH: ${{ steps.sign.outputs.key }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Holding-Local-mac
          path: mac-app/build/Holding-Local-mac.dmg

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Holding (latest builds)" --notes "Rebuilt on every push to main."
          gh release upload latest mac-app/build/Holding-Local-mac.dmg --clobber
