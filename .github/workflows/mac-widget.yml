# Builds the Mac widget (mac-widget/), self-tests it against the built web app on a real Mac,
# and on main attaches it to the "latest" release so the one-line installer can fetch
# https://github.com/<owner>/<repo>/releases/latest/download/Holding-Widget-mac.zip
name: Mac widget

on:
  push:
    branches: [main]
    paths: ['mac-widget/**', 'src/**', 'index.html', '.github/workflows/mac-widget.yml']
  pull_request:
    paths: ['mac-widget/**', 'src/**', 'index.html', '.github/workflows/mac-widget.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app (for the self-test)
        run: npm run build
      - name: Build Holding Widget.app (Apple Silicon + Intel, ad-hoc signed)
        working-directory: mac-widget
        env:
          VERSION: 1.0.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
        run: ./build.sh --universal
      - name: Check the bundle
        working-directory: mac-widget
        run: |
          APP="build/Holding Widget.app"
          lipo -archs "$APP/Contents/MacOS/HoldingWidget"
          codesign --verify --verbose "$APP"
          plutil -lint "$APP/Contents/Info.plist"
      - name: Self-test on this Mac (loads the app in widget mode in the real window)
        run: |
          python3 -m http.server 4820 --bind 127.0.0.1 -d dist >/dev/null 2>&1 &
          sleep 1
          "mac-widget/build/Holding Widget.app/Contents/MacOS/HoldingWidget" --selftest http://127.0.0.1:4820/ | tee selftest.log
          grep -q "SELFTEST PASS" selftest.log
          grep -q "large=true" selftest.log   # first run opens the parent picker, which asks for the bigger window
      - name: Zip
        working-directory: mac-widget/build
        run: ditto -c -k --keepParent "Holding Widget.app" "$RUNNER_TEMP/Holding-Widget-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: holding-widget-mac
          path: ${{ runner.temp }}/Holding-Widget-mac.zip
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Holding (latest builds)" --notes "Rebuilt on every push to main." || true
          gh release upload latest "$RUNNER_TEMP/Holding-Widget-mac.zip" --clobber
