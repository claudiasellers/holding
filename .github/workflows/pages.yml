# Publishes the installable web app to GitHub Pages on every push to main.
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pre-render scripted lines with Kokoro (runs on CPU; only changed lines are re-rendered).
      - name: Restore pre-rendered voice
        uses: actions/cache@v4
        with:
          path: |
            public/audio
            ~/.cache/huggingface
            node_modules/@huggingface/transformers/.cache
          key: voice-${{ hashFiles('src/content/scripted-lines.json', 'scripts/prerender-voice.mjs') }}
          restore-keys: voice-
      # ffmpeg encodes lines to 64 kbps MP3. Without it they'd be stored as WAV (~10x larger in the site and APK).
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Pre-render scripted lines
        run: |
          if [ -f scripts/export-lines.mjs ]; then node scripts/export-lines.mjs; fi
          if [ -f src/content/scripted-lines.json ]; then node scripts/prerender-voice.mjs; else echo "No scripted lines file; skipping."; fi
      - run: npm run build
      - run: npm test
      - name: Mobile end-to-end (emulated iPhone and Pixel)
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run test:mobile
      # Pages serves 404.html for unknown paths; make it the app so deep links still open it.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
